# Include inside the existing HTTPS server.
set $finevent_alias_path "";
if ($host != www.example.com) {
    set $finevent_alias_path $uri;
}
if ($finevent_alias_path ~ ^/finevent/) {
    return 308 https://www.example.com$request_uri;
}
set $finevent_cache "no-cache";
set $finevent_scope "";
location = /finevent {
    return 308 /finevent/;
}
location ^~ /finevent/ {
    alias /srv/example/finevent/web/current/;
    index index.html;
    autoindex off;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
    }
    # A rollback may serve an older (or equally recent) file of the same size.
    etag off;
    if_modified_since off;
    add_header Cache-Control $finevent_cache;
    add_header Service-Worker-Allowed $finevent_scope;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /finevent/sw.js {
        alias /srv/example/finevent/web/current/sw.js;
        set $finevent_scope "/finevent/";
    }
    location /finevent/assets/ {
        alias /srv/example/finevent/web/assets/;
        set $finevent_cache "public, max-age=31536000, immutable";
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_buffering off;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location = /finevent/api/v1/calendar-imports/bls {
        set $finevent_cache "";
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
    }
    location ~ ^/finevent/(api(?:/|$)|healthz$) {
        set $finevent_cache "";
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
    }
}
